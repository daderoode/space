name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # On macOS runner image >= 20260511 both `cargo` and `rustup` in PATH
      # resolve to the rustup-init proxy, which is broken and rejects
      # subcommand arguments. The actual binaries live in the rustup toolchain
      # directory. Prepend that to PATH so cargo/rustfmt/clippy come from the
      # real installation, not the broken proxy.
      - name: Add real toolchain bin to PATH
        run: echo "$(ls -d "$HOME"/.rustup/toolchains/stable-*/bin | head -1)" >> "$GITHUB_PATH"
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: test
        run: cargo test
